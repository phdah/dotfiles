gui:
  nerdFontsVersion: "3"
  theme:
    inactiveBorderColor:
      - "#81a1c1"
    activeBorderColor:
      - "#81a1c1"
      - "bold"
    unstagedChangesColor:
      - "#bf616a"
    searchingActiveBorderColor:
      - "#b48ead"
      - "bold"
    optionsTextColor:
      - "#88c0d0"
    defaultFgColor:
      - "#d8dee9"
    cherryPickedCommitFgColor:
      - "#88c0d0"
    cherryPickedCommitBgColor:
      - "#81a1c1"
    selectedLineBgColor:
      - "#5e81ac"
  showFileTree: true
  os:
    editCommand: "nvim"
    editCommandTemplate: "{{editor}} {{filename}}"
  keybinding:
    universal:
      quit: "q"
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
os:
  # Default clipboard copy dies with the terminal job (e.g. a Neovim floating
  # terminal) that spawned it, since it stays attached to that job's session.
  # Emitting an OSC52 sequence instead makes the *terminal* (Neovim's
  # :terminal handler, or the host terminal emulator directly) perform the
  # clipboard write itself, so it survives the terminal/job being closed.
  copyToClipboardCmd: printf "\033]52;c;$(printf {{text}} | base64 -w 0)\a" > /dev/tty
